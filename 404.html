<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 — Nexora Quote Desk</title>
<style>
  html,body{margin:0;height:100%}
  body{
    display:grid;place-items:center;padding:28px;
    background:radial-gradient(800px 360px at 50% -10%,#eaf0f7 0%,rgba(245,247,250,0) 70%),#f5f7fa;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    color:#1f2937;-webkit-text-size-adjust:100%;
  }
  .box{max-width:440px;text-align:center;background:#fff;border:1px solid #e6e9ef;border-radius:20px;padding:36px 28px;box-shadow:0 24px 60px -32px rgba(11,18,32,.35)}
  .mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(158deg,#1b4a73,#0b2036);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;margin:0 auto 18px}
  h1{font-size:20px;letter-spacing:-.03em;color:#0b1220;margin:0 0 10px}
  p{margin:0;font-size:13.5px;color:#5d6775;line-height:1.7}
  a.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;padding:12px 20px;border-radius:12px;background:linear-gradient(180deg,#173f63,#0e2a47);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
  .en{display:block;margin-top:16px;font-size:12.5px;color:#8a95a3;line-height:1.7}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">N</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 잘못 입력되었습니다. 허브에서 원하는 제품을 다시 골라 주세요.</p>
    <a class="btn" href="/nexora-quote-desk/">Nexora Quote Desk 홈으로</a>
    <span class="en">Page not found. Head back to the hub to pick Lite or the Business Kit.</span>
  </div>
</body>
</html>
