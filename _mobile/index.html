<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>mobile check</title>
<style>
  body{margin:0;background:#0b1220;font-family:system-ui,sans-serif;color:#9fb2c6}
  .row{display:flex;gap:16px;padding:16px;align-items:flex-start}
  .dev{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px -20px #000}
  .cap{font-size:12px;padding:6px 10px;background:#16233a;color:#8fa6bd}
  iframe{display:block;border:0;background:#fff}
  .a iframe{width:390px;height:844px}
  .b iframe{width:768px;height:844px}
</style>
</head>
<body>
<div class="row">
  <div class="dev a"><div class="cap">iPhone 390px — hub</div><iframe src="../" title="hub 390"></iframe></div>
  <div class="dev b"><div class="cap">iPad 768px — hub</div><iframe src="../" title="hub 768"></iframe></div>
</div>
</body>
</html>
